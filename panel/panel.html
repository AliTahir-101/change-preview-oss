<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChangePreview</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel">
    <header class="header">
      <div class="header-main">
        <h1 class="title">ChangePreview</h1>
        <div class="host" id="hostInfo">—</div>
      </div>
      <div class="header-meta">
        <span class="change-count" id="changeCount">0 changes</span>
        <span class="coverage" id="coverage" title="Fields being tracked">
          <span class="coverage-icon">◉</span>
          <span id="coverageText">—</span>
        </span>
      </div>
    </header>

    <main class="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✓</div>
        <div class="empty-text">No changes detected</div>
        <div class="empty-hint">Edit form fields to see what's changed</div>
      </div>

      <table class="changes-table" id="changesTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Field</th>
            <th>Was</th>
            <th>Now</th>
          </tr>
        </thead>
        <tbody id="changesBody">
        </tbody>
      </table>
    </main>

    <footer class="footer">
      <div class="actions">
        <button class="btn btn-primary" id="copyMarkdown" disabled>
          <span class="btn-icon">📋</span> Copy Markdown
        </button>
        <button class="btn btn-secondary" id="copyCsv" disabled>
          <span class="btn-icon">📄</span> Copy CSV
        </button>
        <button class="btn btn-secondary" id="downloadCsv" disabled>
          <span class="btn-icon">⬇</span> Download CSV
        </button>
      </div>
      <div class="footer-bottom">
        <div class="privacy-note">
          <span class="lock-icon">🔒</span> Local only · passwords skipped
        </div>
        <button class="btn btn-danger-text" id="clearDetections">
          <span class="btn-icon">🗑</span> Clear detections
        </button>
      </div>
    </footer>
    
    <div class="confirm-dialog hidden" id="confirmDialog">
      <div class="confirm-dialog-content">
        <p>Clear all detected changes?</p>
        <p class="confirm-hint">This will reset the baseline to current values.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
          <button class="btn btn-danger" id="confirmClear">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="panel.js"></script>
</body>
</html>
